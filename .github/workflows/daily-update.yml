name: Scheduled Live Data Update

on:
  schedule:
    - cron: '0 0 * * *' # 每天国际标准时间 00:00 (北京时间早上 8 点) 自动运行
  workflow_dispatch: # 允许你随时在 GitHub 网页上手动点击按钮立即触发更新

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Web Scraper Script
        run: node scripts/update-data.js

      - name: Build React Application
        run: npm run build

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/tools.json docs/
          # 仅在有数据变动时提交，防止无变动报错
          git diff-index --quiet HEAD || git commit -m "chore: auto-update live metrics [skip ci]"
          git push
